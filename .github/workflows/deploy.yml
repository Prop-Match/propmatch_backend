name: Backend CI & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --ci
      - run: npm run build

  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Pull main and update Docker containers
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu

            cd ~/propmatch_backend

            if [ "$(git branch --show-current)" != "main" ]; then
              echo "Deployment directory must be checked out on the main branch."
              exit 1
            fi

            git pull --ff-only origin main

            docker compose config --quiet
            docker compose build
            docker compose up -d --wait --wait-timeout 120 postgres redis
            docker compose run --rm migrate

            if ! docker compose up -d --no-deps --wait --wait-timeout 120 backend; then
              echo "Backend failed its health check. Container status and recent logs:"
              docker compose ps --all
              docker compose logs --no-color --tail 200 backend redis postgres
              exit 1
            fi

            docker compose ps
